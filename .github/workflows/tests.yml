
name: GNSS Project Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q
        env:
          PYTHONPATH: src

      - name: Run GNSS noise experiment
        run: python scripts/run_noise_experiment.py
        env:
          PYTHONPATH: src

      - name: Run GNSS geometry experiment
        run: python scripts/run_geometry_experiment.py
        env:
          PYTHONPATH: src
          
      - name: Run satellite availability experiment
        run: PYTHONPATH=src python scripts/run_satellite_availability_experiment.py

      - name: Run pseudorange fault detection experiment
        run: python scripts/run_fault_detection_experiment.py
        env:
          PYTHONPATH: src
          
      - name: Evaluate fault detection performance
        run: python scripts/evaluate_fault_detection.py
        env:
          PYTHONPATH: src

      - name: Evaluate leave-one-out fault diagnostics
        run: python scripts/evaluate_leave_one_out.py
        env:
          PYTHONPATH: src
          
      - name: Evaluate threshold sensitivity
        run: python scripts/evaluate_threshold_sensitivity.py
        env:
          PYTHONPATH: src
        
      - name: Analyze fault isolation by satellite
        run: python scripts/analyze_isolation_by_satellite.py
        env:
          PYTHONPATH: src
      
      - name: Analyze GNSS residual patterns
        run: python scripts/analyze_residual_patterns.py
        env:
          PYTHONPATH: src
          
      - name: Analyze leave-one-out scores
        run: python scripts/analyze_leave_one_out_scores.py
        env:
          PYTHONPATH: src
      
      - name: Analyze leave-one-out geometry conditioning
        run: python scripts/analyze_geometry_conditioning.py
        env:
          PYTHONPATH: src
      
      - name: Upload geometry conditioning report
        uses: actions/upload-artifact@v4
        with:
          name: geometry-conditioning-report
          path: results/geometry_conditioning_report.json
          if-no-files-found: error
          
      - name: Analyze leave-one-out subset position errors
        run: python scripts/analyze_subset_position_errors.py
        env:
          PYTHONPATH: src

      - name: Evaluate geometry-aware fault isolation
        run: python scripts/evaluate_geometry_aware_isolation.py
        env:
          PYTHONPATH: src

      - name: Upload geometry-aware isolation report
        uses: actions/upload-artifact@v4
        with:
          name: geometry-aware-isolation-report
          path: results/geometry_aware_isolation_report.json
          if-no-files-found: error

      
      
      - name: Upload leave-one-out score report
        uses: actions/upload-artifact@v4
        with:
          name: leave-one-out-score-report
          path: results/leave_one_out_score_report.json
          if-no-files-found: error

      




      

        
      
      

